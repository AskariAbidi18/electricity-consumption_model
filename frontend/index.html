<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Consumption Forecaster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.15);
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 1.1em;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 30px;
            text-align: left;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 1.1em;
        }

        .date-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1.1em;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        .date-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .predict-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            margin-top: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 16px;
            display: none;
            animation: slideInUp 0.5s ease;
        }

        .result.success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .result.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .result-unit {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .result-date {
            margin-top: 15px;
            font-size: 1.1em;
            opacity: 0.9;
        }

        .energy-icon {
            font-size: 3em;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .api-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 600;
            display: none;
        }

        .api-status.online {
            background: #10b981;
            color: white;
        }

        .api-status.offline {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <div class="api-status" id="apiStatus"></div>
    
    <div class="container">
        <div class="header">
            <div class="energy-icon">⚡</div>
            <h1 class="title">Power Predictor</h1>
            <p class="subtitle">AI-powered electricity consumption forecasting</p>
        </div>

        <form id="forecastForm">
            <div class="form-group">
                <label for="dateInput" class="form-label">Select Future Date</label>
                <input 
                    type="date" 
                    id="dateInput" 
                    class="date-input"
                    required
                    min=""
                >
            </div>

            <button type="submit" class="predict-btn" id="predictBtn">
                🔮 Predict Consumption
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Analyzing future energy patterns...</p>
        </div>

        <div class="result" id="result">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-value" id="resultValue"></div>
            <div class="result-unit">kW average consumption</div>
            <div class="result-date" id="resultDate"></div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = 'http://localhost:8000'; // Update this to your FastAPI server URL

        // Set date range from 2010 to allow historical data testing
        document.getElementById('dateInput').min = '2010-01-01';

        // Check API status on page load
        checkApiStatus();

        // Form submission handler
        document.getElementById('forecastForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const dateInput = document.getElementById('dateInput');
            const predictBtn = document.getElementById('predictBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            if (!dateInput.value) {
                showError('Please select a date');
                return;
            }

            // Show loading state
            predictBtn.disabled = true;
            predictBtn.textContent = 'Predicting...';
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/forecast`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        date: dateInput.value
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                } else {
                    showSuccess(data);
                }

            } catch (error) {
                console.error('Error:', error);
                showError('Failed to connect to the prediction service. Please check if the API is running.');
            } finally {
                // Reset button state
                predictBtn.disabled = false;
                predictBtn.textContent = '🔮 Predict Consumption';
                loading.style.display = 'none';
            }
        });

        function showSuccess(data) {
            const result = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultValue = document.getElementById('resultValue');
            const resultDate = document.getElementById('resultDate');
            
            result.className = 'result success';
            resultTitle.textContent = 'Prediction Complete! ✨';
            resultValue.textContent = data.forecast_avg_consumption.toFixed(2);
            resultDate.textContent = `Forecast for ${formatDate(data.date)}`;
            
            result.style.display = 'block';
        }

        function showError(message) {
            const result = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultValue = document.getElementById('resultValue');
            const resultDate = document.getElementById('resultDate');
            
            result.className = 'result error';
            resultTitle.textContent = 'Prediction Failed ❌';
            resultValue.textContent = 'Error';
            resultDate.textContent = message;
            
            result.style.display = 'block';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        async function checkApiStatus() {
            const statusElement = document.getElementById('apiStatus');
            
            try {
                const response = await fetch(`${API_BASE_URL}/`);
                if (response.ok) {
                    statusElement.textContent = 'API Online';
                    statusElement.className = 'api-status online';
                } else {
                    throw new Error('API not responding');
                }
            } catch (error) {
                statusElement.textContent = 'API Offline';
                statusElement.className = 'api-status offline';
            }
            
            statusElement.style.display = 'block';
        }

        // Check API status every 30 seconds
        setInterval(checkApiStatus, 30000);
    </script>
</body>
</html>
